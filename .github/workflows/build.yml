# SPDX-License-Identifier: MIT

name: "NocFree & — JIS / USB Dongle / ZMK Studio"
run-name: "JIS / USB Dongle / ZMK Studio — ${{ github.ref_name }}"

on:
  push:
    branches: [main, jis-studio, dongle, "v*"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run repository tests
        run: ./tests/run.sh

  # Keep the build harness pinned to the same ZMK revision as config/west.yml.
  firmware:
    name: Firmware
    needs: validate
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@6e2ef41e022d555b10f116e395832913f71717b3

  # Rebuild the four normal-role images so tests can inspect the resolved
  # Kconfig, devicetree, map files and UF2 boundaries.
  artifacts:
    name: Verify built artifacts
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v4
      - name: Build left, right, Pad and dongle from the pinned manifest
        run: |
          if [ -z "${ZEPHYR_SDK_INSTALL_DIR:-}" ]; then
            sdk=$(ls -d /opt/zephyr-sdk-* 2>/dev/null | head -1)
            if [ -n "${sdk}" ]; then
              export ZEPHYR_SDK_INSTALL_DIR="${sdk}"
              export ZEPHYR_TOOLCHAIN_VARIANT=zephyr
            fi
          fi

          mkdir -p /tmp/ws/config
          cp -R config/. /tmp/ws/config/
          cd /tmp/ws
          west init -l config
          west update --fetch-opt=--filter=tree:0
          west zephyr-export

          dongle_keymap="${GITHUB_WORKSPACE}/boards/shields/nocfree_and/"
          dongle_keymap="${dongle_keymap}nocfree_and_dongle.keymap"
          pad_keymap="${GITHUB_WORKSPACE}/boards/nocfree/nocfree_and/"
          pad_keymap="${pad_keymap}nocfree_and_pad.keymap"
          pad_diag_keymap="${GITHUB_WORKSPACE}/boards/nocfree/nocfree_and/"
          pad_diag_keymap="${pad_diag_keymap}pad_usb_diag.keymap"
          pad_diag_overlay="${GITHUB_WORKSPACE}/boards/nocfree/nocfree_and/"
          pad_diag_overlay="${pad_diag_overlay}pad_usb_diag.overlay"
          battery_diag_overlay="${GITHUB_WORKSPACE}/boards/nocfree/nocfree_and/"
          battery_diag_overlay="${battery_diag_overlay}battery_diag.overlay"
          led_probe_overlay="${GITHUB_WORKSPACE}/boards/nocfree/nocfree_and/"
          led_probe_overlay="${led_probe_overlay}led_probe.overlay"

          west build -s zmk/app -d /tmp/ws/build/left \
            -b nocfree_and_left/nrf52833/zmk -- \
            -DZMK_CONFIG=/tmp/ws/config \
            -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}" \
            -DCONFIG_ZMK_SPLIT=y \
            -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n \
            -DCONFIG_ZMK_USB=n \
            -DCONFIG_USB_DEVICE_STACK=y \
            -DCONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y \
            -DCONFIG_ZMK_SPLIT_BLE_PERIPHERAL_POSITION_QUEUE_SIZE=32

          west build -s zmk/app -d /tmp/ws/build/right \
            -b nocfree_and_right/nrf52833/zmk -- \
            -DZMK_CONFIG=/tmp/ws/config \
            -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}" \
            -DCONFIG_ZMK_SPLIT=y \
            -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

          west build -s zmk/app -d /tmp/ws/build/pad \
            -b nocfree_and_pad/nrf52833/zmk -- \
            -DZMK_CONFIG=/tmp/ws/config \
            -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}" \
            -DCONFIG_ZMK_SPLIT=y \
            -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n \
            -DCONFIG_ZMK_USB=n \
            -DCONFIG_USB_DEVICE_STACK=y \
            -DCONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y \
            -DCONFIG_ZMK_SPLIT_BLE_PERIPHERAL_POSITION_QUEUE_SIZE=32 \
            -DKEYMAP_FILE="${pad_keymap}"

          west build -s zmk/app -d /tmp/ws/build/pad_usb_diagnostic \
            -b nocfree_and_pad/nrf52833/zmk -- \
            -DZMK_CONFIG=/tmp/ws/config \
            -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}" \
            -DCONFIG_ZMK_SPLIT=n \
            -DCONFIG_ZMK_USB=y \
            -DCONFIG_ZMK_BLE=n \
            -DCONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n \
            -DCONFIG_ZMK_USB_LOGGING=y \
            -DCONFIG_NOCFREE_PAD_I2C_DIAGNOSTIC=y \
            -DEXTRA_DTC_OVERLAY_FILE="${pad_diag_overlay}" \
            -DKEYMAP_FILE="${pad_diag_keymap}"

          west build -s zmk/app -d /tmp/ws/build/dongle \
            -b xiao_ble//zmk -S studio-rpc-usb-uart -- \
            -DSHIELD=nocfree_and_dongle \
            -DZMK_CONFIG=/tmp/ws/config \
            -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}" \
            -DKEYMAP_FILE="${dongle_keymap}" \
            -DCONFIG_ZMK_STUDIO=y \
            -DCONFIG_ZMK_STUDIO_LOCKING=n

          west build -s zmk/app -d /tmp/ws/build/left_battery_adc_probe \
            -b nocfree_and_left/nrf52833/zmk -- \
            -DZMK_CONFIG=/tmp/ws/config \
            -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}" \
            -DCONFIG_ZMK_SPLIT=n \
            -DCONFIG_ZMK_BLE=n \
            -DCONFIG_ZMK_USB=y \
            -DCONFIG_ZMK_BATTERY_REPORTING=n \
            -DCONFIG_ADC=y \
            -DCONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n \
            -DCONFIG_ZMK_USB_LOGGING=y \
            -DCONFIG_ZMK_LOGGING_MINIMAL=y \
            -DCONFIG_NOCFREE_BATTERY_ADC_PROBE=y \
            -DEXTRA_DTC_OVERLAY_FILE="${battery_diag_overlay}"

          west build -s zmk/app -d /tmp/ws/build/right_battery_adc_probe \
            -b nocfree_and_right/nrf52833/zmk -- \
            -DZMK_CONFIG=/tmp/ws/config \
            -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}" \
            -DCONFIG_ZMK_SPLIT=n \
            -DCONFIG_ZMK_BLE=n \
            -DCONFIG_ZMK_USB=y \
            -DCONFIG_ZMK_BATTERY_REPORTING=n \
            -DCONFIG_ADC=y \
            -DCONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n \
            -DCONFIG_ZMK_USB_LOGGING=y \
            -DCONFIG_ZMK_LOGGING_MINIMAL=y \
            -DCONFIG_NOCFREE_BATTERY_ADC_PROBE=y \
            -DEXTRA_DTC_OVERLAY_FILE="${battery_diag_overlay}"

          west build -s zmk/app -d /tmp/ws/build/left_low_battery_led_probe \
            -b nocfree_and_left/nrf52833/zmk -- \
            -DZMK_CONFIG=/tmp/ws/config \
            -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}" \
            -DCONFIG_ZMK_SPLIT=n \
            -DCONFIG_ZMK_BLE=n \
            -DCONFIG_ZMK_USB=y \
            -DCONFIG_ZMK_BATTERY_REPORTING=n \
            -DCONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n \
            -DCONFIG_ZMK_USB_LOGGING=y \
            -DCONFIG_ZMK_LOGGING_MINIMAL=y \
            -DCONFIG_NOCFREE_LOW_BATTERY_LED_PROBE=y \
            -DEXTRA_DTC_OVERLAY_FILE="${led_probe_overlay}"

          west build -s zmk/app -d /tmp/ws/build/right_low_battery_led_probe \
            -b nocfree_and_right/nrf52833/zmk -- \
            -DZMK_CONFIG=/tmp/ws/config \
            -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}" \
            -DCONFIG_ZMK_SPLIT=n \
            -DCONFIG_ZMK_BLE=n \
            -DCONFIG_ZMK_USB=y \
            -DCONFIG_ZMK_BATTERY_REPORTING=n \
            -DCONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n \
            -DCONFIG_ZMK_USB_LOGGING=y \
            -DCONFIG_ZMK_LOGGING_MINIMAL=y \
            -DCONFIG_NOCFREE_LOW_BATTERY_LED_PROBE=y \
            -DEXTRA_DTC_OVERLAY_FILE="${led_probe_overlay}"

      - name: Run the full suite against the build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          NOCFREE_BUILD_DIR=/tmp/ws/build ./tests/run.sh
