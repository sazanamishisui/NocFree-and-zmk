# The dongle is USB powered and is the host-facing HID endpoint.
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# No battery source exists on the USB dongle.
CONFIG_ZMK_BATTERY_REPORTING=n

# Disabled on the pinned ZMK revision. A host-side BLE disconnect can be
# mistaken for a split-peripheral disconnect and yield an invalid slot index
# (observed as source 234), followed by an out-of-bounds battery-array write.
# Left/right may continue measuring and advertising BAS; this dongle ignores it
# until the central path is safely patched or upgraded.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n

# Match the proven NocFree split settings: keep BLE at 1M PHY and give the
# controller enough TX buffering to survive short RF fades without losing
# split-position events.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_CONN_TX_MAX=8

# The central receives independent position streams from three peripherals.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=32
