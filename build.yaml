# SPDX-License-Identifier: MIT

include:
  # NocFree halves become BLE split peripherals. The existing board definitions,
  # PCA9555 scanner and debounce configuration remain unchanged.
  - board: nocfree_and_left/nrf52833/zmk
    artifact-name: nocfree_and_left_peripheral
    cmake-args: >-
      -DCONFIG_ZMK_SPLIT=y
      -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
      -DCONFIG_ZMK_USB=n
      -DCONFIG_USB_DEVICE_STACK=y
      -DCONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
      -DCONFIG_ZMK_SPLIT_BLE_PERIPHERAL_POSITION_QUEUE_SIZE=32

  - board: nocfree_and_right/nrf52833/zmk
    artifact-name: nocfree_and_right_peripheral
    cmake-args: >-
      -DCONFIG_ZMK_SPLIT=y
      -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

  - board: nocfree_and_pad/nrf52833/zmk
    artifact-name: nocfree_and_pad_peripheral
    cmake-args: >-
      -DCONFIG_ZMK_SPLIT=y
      -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
      -DCONFIG_ZMK_USB=n
      -DCONFIG_USB_DEVICE_STACK=y
      -DCONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
      -DCONFIG_ZMK_SPLIT_BLE_PERIPHERAL_POSITION_QUEUE_SIZE=32
      -DKEYMAP_FILE=${GITHUB_WORKSPACE}/boards/nocfree/nocfree_and/nocfree_and_pad.keymap

  # Temporary standalone USB-HID image used to separate Pad matrix/I2C faults
  # from BLE split-pairing faults. It does not erase settings and is not a
  # production image.
  - board: nocfree_and_pad/nrf52833/zmk
    artifact-name: nocfree_and_pad_usb_diagnostic
    cmake-args: >-
      -DCONFIG_ZMK_SPLIT=n
      -DCONFIG_ZMK_USB=y
      -DCONFIG_ZMK_BLE=n
      -DKEYMAP_FILE=${GITHUB_WORKSPACE}/boards/nocfree/nocfree_and/pad_usb_diag.keymap

  # USB-powered dongle is the only split central and owns the keymap/layers.
  - board: xiao_ble//zmk
    shield: nocfree_and_dongle
    artifact-name: nocfree_and_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: >-
      -DCONFIG_ZMK_STUDIO=y
      -DCONFIG_ZMK_STUDIO_LOCKING=n
      -DKEYMAP_FILE=${GITHUB_WORKSPACE}/boards/shields/nocfree_and/nocfree_and_dongle.keymap

  # Recovery images are provided for every device. Existing left/right bonds
  # should normally be preserved when adding the Pad; reset only if pairing
  # does not converge.
  - board: nocfree_and_left/nrf52833/zmk
    shield: settings_reset
    artifact-name: nocfree_and_left_settings_reset

  - board: nocfree_and_right/nrf52833/zmk
    shield: settings_reset
    artifact-name: nocfree_and_right_settings_reset

  - board: nocfree_and_pad/nrf52833/zmk
    shield: settings_reset
    artifact-name: nocfree_and_pad_settings_reset
    cmake-args: >-
      -DKEYMAP_FILE=${GITHUB_WORKSPACE}/boards/nocfree/nocfree_and/nocfree_and_pad.keymap

  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: nocfree_and_dongle_settings_reset
